<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="map-origin" content="__MAP__"><meta name="robots" content="noindex,nofollow"><title>设备列表 · 只读</title><link rel="stylesheet" href="/view/base.css"><link rel="stylesheet" href="/view/console.css"><link rel="stylesheet" href="/view/ubuntu-theme.css"><style>#view-devices td:first-child{width:auto;min-width:205px}#view-devices td:nth-child(2){min-width:170px}#view-devices td:nth-child(3){min-width:250px;max-width:400px}#view-devices td:nth-child(4){min-width:155px;max-width:none}#view-devices td:nth-child(5){min-width:90px}.readonly-label{font-size:13px;color:#ead9e4}#page{width:85px}</style><link rel="stylesheet" href="/view/unified-track.css"><script defer src="/view/time.js?v=20261113-standalone"></script><script defer src="/view/unified-track.js?v=20261113-view"></script><script defer src="/view/viewer.js?v=20261113-track-layout"></script></head><body><header class="shell-head"><strong>FindMy</strong><nav><button class="active" type="button">设备列表</button></nav><span class="readonly-label">只读访问</span><button id="refresh">刷新</button></header><main><p id="message" role="status"></p><section id="view-devices"><div class="heading"><h1>设备列表</h1><span id="count"></span></div><div class="controls"><label>排序 <select id="sort"><option value="time">最新上报时间</option><option value="battery">电量</option><option value="name" selected>名称</option></select></label><select id="direction" aria-label="升降序"><option value="asc">升序</option><option value="desc">降序</option></select><input id="search" type="search" placeholder="搜索设备名称、SN、MAC" aria-label="搜索设备"></div><div class="table-scroll"><table><thead><tr><th>设备名称 / SN / MAC</th><th>最新上报时间</th><th>最新位置</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager" style="flex-wrap:wrap"><label>每页 <select id="size"><option>10</option><option>20</option><option>50</option>
